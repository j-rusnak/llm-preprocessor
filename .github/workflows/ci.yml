name: CI

on:
  push:
    branches: ["main", "polish-features"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }} build and verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ort_package: onnxruntime-win-x64
            ort_archive_ext: zip
            app_path: build/install-check/bin/preprocessor_app.exe
            ort_install_path: build/install-check/bin/onnxruntime.dll
            smoke_path: build/Debug/smoke_runner.exe
            effectiveness_path: build/Debug/effectiveness_runner.exe
            ctest_config_args: -C Debug
          - name: Linux
            os: ubuntu-latest
            ort_package: onnxruntime-linux-x64
            ort_archive_ext: tgz
            app_path: build/install-check/bin/preprocessor_app
            ort_install_path: build/install-check/lib/libonnxruntime.so
            smoke_path: build/smoke_runner
            effectiveness_path: build/effectiveness_runner
            ctest_config_args: ""
          - name: macOS
            os: macos-latest
            ort_package: onnxruntime-osx-universal2
            ort_archive_ext: tgz
            app_path: build/install-check/bin/preprocessor_app
            ort_install_path: build/install-check/lib/libonnxruntime.dylib
            smoke_path: build/smoke_runner
            effectiveness_path: build/effectiveness_runner
            ctest_config_args: ""

    env:
      ONNXRUNTIME_VERSION: "1.23.2"
      BUILD_TYPE: Debug
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release hygiene
        shell: pwsh
        run: |
          $trackedIgnored = git ls-files -ci --exclude-standard
          if ($trackedIgnored) {
            Write-Error "Tracked ignored files must be removed from the Git index:`n$($trackedIgnored -join "`n")"
          }

      - name: Secret scan
        shell: pwsh
        run: |
          python tools/secret_scan.py
          python tools/secret_scan.py --ref HEAD

      - name: Release smoke script dry run
        shell: pwsh
        run: python tools/release_smoke.py --dry-run --skip-playwright --skip-install

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $version = $env:ONNXRUNTIME_VERSION
          $name = "${{ matrix.ort_package }}-$version"
          $archive = "$name.${{ matrix.ort_archive_ext }}"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$version/$archive"
          if (Test-Path -LiteralPath $name) {
            Remove-Item -LiteralPath $name -Recurse -Force
          }
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ("${{ matrix.ort_archive_ext }}" -eq "zip") {
            Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          } else {
            tar -xzf $archive
          }
          if ($IsLinux) {
            "LD_LIBRARY_PATH=$pwd/$name/lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($IsMacOS) {
            "DYLD_LIBRARY_PATH=$pwd/$name/lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          if ($IsWindows) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          }

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            "-S", ".",
            "-B", "build",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"
          )
          if ($IsWindows) {
            $cmakeArgs += @("-G", "Visual Studio 17 2022", "-A", "x64")
          }
          cmake @cmakeArgs

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Install smoke check
        shell: pwsh
        run: |
          cmake --install build --config $env:BUILD_TYPE --prefix build/install-check
          $required = @(
            "${{ matrix.app_path }}",
            "${{ matrix.ort_install_path }}",
            "build/install-check/lib/cmake/LLMPreprocessor/LLMPreprocessorConfig.cmake",
            "build/install-check/lib/cmake/LLMPreprocessor/LLMPreprocessorConfigVersion.cmake"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing installed artifact: $path"
            }
          }
          python tools/package_audit.py build/install-check
          python tools/artifact_checksums.py build/install-check --output build/install-check.SHA256SUMS

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build ${{ matrix.ctest_config_args }} --output-on-failure

      - name: Smoke runner
        shell: pwsh
        run: "& '${{ matrix.smoke_path }}'"

      - name: Effectiveness runner
        shell: pwsh
        run: "& '${{ matrix.effectiveness_path }}'"

      - name: Visualizer unit tests
        shell: pwsh
        run: python -m unittest discover tools/perf_visualizer/tests -p "test_*.py"

      - name: Release tooling unit tests
        shell: pwsh
        run: python -m unittest discover tools/tests -p "test_*.py"

      - name: Visualizer Playwright smoke
        shell: pwsh
        run: |
          $hasPlaywright = python -c "import importlib.util; print('yes' if importlib.util.find_spec('playwright') else 'no')"
          if ($hasPlaywright.Trim() -ne "yes") {
            Write-Host "Python Playwright is not installed; skipping dashboard browser smoke."
            exit 0
          }
          python tools/perf_visualizer/tests/validate_dashboard.py `
            --effectiveness-exe "${{ matrix.effectiveness_path }}"
